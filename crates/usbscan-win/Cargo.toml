[package]
name = "usbscan-win"
description = "Win32 原生界面封装"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
usbscan-capture = { path = "../usbscan-capture" }
usbscan-doc = { path = "../usbscan-doc" }
usbscan-export = { path = "../usbscan-export" }
usbscan-imaging = { path = "../usbscan-imaging" }
usbscan-naming = { path = "../usbscan-naming" }
usbscan-ocr = { path = "../usbscan-ocr" }
usbscan-pdf = { path = "../usbscan-pdf" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_Storage_FileSystem", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
