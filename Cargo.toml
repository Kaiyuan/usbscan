[workspace]
resolver = "2"
members = [
    "crates/usbscan-app",
    "crates/usbscan-capture",
    "crates/usbscan-doc",
    "crates/usbscan-export",
    "crates/usbscan-imaging",
    "crates/usbscan-naming",
    "crates/usbscan-win",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["usbscan contributors"]
repository = "https://github.com/Kaiyuan/usbscan"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
must_use_candidate = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
