[package]
name = "usbscan-app"
description = "usbscan 主程序（Slint UI）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
usbscan-capture = { path = "../usbscan-capture" }
usbscan-doc = { path = "../usbscan-doc" }
usbscan-export = { path = "../usbscan-export" }
usbscan-imaging = { path = "../usbscan-imaging" }
usbscan-naming = { path = "../usbscan-naming" }
usbscan-ocr = { path = "../usbscan-ocr" }
usbscan-win = { path = "../usbscan-win" }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-18",
] }
i-slint-core = { version = "=1.18.1", default-features = false, features = ["svg"] }
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
rfd = { version = "0.15", default-features = false }

[build-dependencies]
slint-build = "1.18"
winres = "0.1"

[[bin]]
name = "usbscan"
path = "src/main.rs"
