name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # Windows x64
  # -------------------------------------------------------------------------
  windows-x64:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace

      - name: Build usbscan-app
        run: cargo build --release -p usbscan-app

  # -------------------------------------------------------------------------
  # macOS (Apple Silicon arm64 & Intel x64)
  # -------------------------------------------------------------------------
  macos:
    name: macOS ${{ matrix.arch }} (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            deployment-target: "11.0"
          - arch: x64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            deployment-target: "10.15"
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment-target }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      # 与发布脚本保持一致：macOS 平台专属代码无法在本机验证，告警只提示不阻断。
      - name: Clippy Lint (advisory)
        run: cargo clippy --workspace --all-targets --target ${{ matrix.target }}

      - name: Run Tests
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: Build usbscan-app
        run: cargo build --release -p usbscan-app --target ${{ matrix.target }}

  # -------------------------------------------------------------------------
  # Linux (x64 & arm64, native runners)
  # -------------------------------------------------------------------------
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # 与 .github/workflows/release.yml 的依赖列表保持一致。
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake nasm libclang-dev \
            libasound2-dev libssl-dev libfontconfig1-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libv4l-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Format Check
        run: cargo fmt --all -- --check

      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Tests
        run: cargo test --workspace

      - name: Build usbscan-app
        run: cargo build --release -p usbscan-app
