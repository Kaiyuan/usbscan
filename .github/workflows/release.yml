name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read workspace version
        id: version
        shell: bash
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$version" ]; then
            echo "Unable to read the workspace version" >&2
            exit 1
          fi
          tag="${{ github.event.release.tag_name }}"
          if [ -n "$tag" ] && [ "$tag" != "v$version" ] && [ "$tag" != "$version" ]; then
            echo "Release tag '$tag' does not match Cargo.toml version '$version'" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build, test and package
        run: powershell -ExecutionPolicy Bypass -File .\build.ps1

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe',
            'C:\Program Files\Inno Setup 7\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'ISCC.exe not found' }
          & $iscc '/DMyAppVersion=${{ needs.version.outputs.version }}' 'installer\usbscan.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            dist/usbscan.exe
            dist/usbscan-${{ needs.version.outputs.version }}-win-x64.zip
            dist/usbscan-${{ needs.version.outputs.version }}-setup.exe

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Build Apple Silicon package
        # 跳过 lint：macOS 专属代码无法在 Windows/Linux 上运行 Clippy，
        # build/test 仍会完整编译并运行全部测试。
        run: bash ./build.sh --skip-lint

      - name: Keep Apple Silicon binary
        run: cp dist/usbscan.app/Contents/MacOS/usbscan dist/usbscan-arm64

      - name: Build Intel package
        env:
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: bash ./build.sh --target x86_64-apple-darwin

      - name: Build Universal package
        shell: bash
        run: |
          version='${{ needs.version.outputs.version }}'
          universal="$(mktemp)"
          lipo -create \
            dist/usbscan-arm64 \
            dist/usbscan.app/Contents/MacOS/usbscan \
            -output "$universal"
          cp "$universal" dist/usbscan.app/Contents/MacOS/usbscan
          rm -f "$universal" dist/usbscan-arm64
          codesign --force --deep --sign - dist/usbscan.app
          lipo -archs dist/usbscan.app/Contents/MacOS/usbscan
          tar -czf "dist/usbscan-${version}-macos-universal.tar.gz" -C dist usbscan.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: dist/usbscan-*-macos-*.tar.gz

  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
          - runner: ubuntu-22.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake nasm \
            libasound2-dev libssl-dev libfontconfig1-dev libxkbcommon-dev \
            libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libx11-dev \
            libxcursor-dev libxrandr-dev libxi-dev libv4l-dev libudev-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build, test and package
        run: bash ./build.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/usbscan-*-linux-*.tar.gz
            dist/usbscan_*_*.deb

  uos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # UOS V20 基于 Debian 10（glibc 2.28 / OpenSSL 1.1.1）。只在容器中编译和打包，
      # 复用宿主机安装的 Rust 工具链，避免依赖容器内的 Node/action 环境。
      - name: Build in Debian 10 (UOS V20) container
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HOST_ARCH: ${{ matrix.arch }}
          DEB_ARCH: ${{ matrix.deb_arch }}
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            -v "$HOME/.cargo:/root/.cargo" \
            -v "$HOME/.rustup:/root/.rustup" \
            -e RUSTUP_HOME=/root/.rustup \
            -e CARGO_HOME=/root/.cargo \
            -e PATH=/root/.cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -e VERSION \
            -e HOST_ARCH \
            -e DEB_ARCH \
            debian:buster bash -euc '
              sed -i "s|deb.debian.org/debian|archive.debian.org/debian|g" /etc/apt/sources.list
              sed -i "s|security.debian.org/debian-security|archive.debian.org/debian-security|g" /etc/apt/sources.list
              sed -i "/buster-updates/d" /etc/apt/sources.list
              apt-get -o Acquire::Check-Valid-Until=false update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates build-essential pkg-config cmake nasm tar gzip \
                libasound2-dev libssl-dev libfontconfig1-dev libxkbcommon-dev \
                libgl1-mesa-dev libegl1-mesa-dev libwayland-dev libx11-dev \
                libxcursor-dev libxrandr-dev libxi-dev libv4l-dev libudev-dev
              bash ./build.sh
              mv "dist/usbscan-${VERSION}-linux-${HOST_ARCH}.tar.gz" "dist/usbscan-${VERSION}-uos-${HOST_ARCH}.tar.gz"
              mv "dist/usbscan_${VERSION}_${DEB_ARCH}.deb" "dist/usbscan_${VERSION}_uos_${DEB_ARCH}.deb"
            '

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: uos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            dist/usbscan-*-uos-*.tar.gz
            dist/usbscan_*_uos_*.deb

  publish:
    needs: [version, windows, macos, linux, uos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        working-directory: dist
        shell: bash
        run: |
          files=(
            usbscan-*-setup.exe
            usbscan-*-win-*.zip
            usbscan-*-macos-*.tar.gz
            usbscan-*-linux-*.tar.gz
            usbscan-*-uos-*.tar.gz
            usbscan_*.deb
          )
          ls -l "${files[@]}"
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/usbscan-*-setup.exe
            dist/usbscan-*-win-*.zip
            dist/usbscan-*-macos-*.tar.gz
            dist/usbscan-*-linux-*.tar.gz
            dist/usbscan-*-uos-*.tar.gz
            dist/usbscan_*.deb
            dist/SHA256SUMS.txt
