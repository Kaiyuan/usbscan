[package]
name = "usbscan-app"
description = "usbscan 主程序（Slint UI）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
usbscan-capture = { path = "../usbscan-capture" }
usbscan-doc = { path = "../usbscan-doc" }
usbscan-export = { path = "../usbscan-export" }
usbscan-imaging = { path = "../usbscan-imaging" }
usbscan-naming = { path = "../usbscan-naming" }
usbscan-ocr = { path = "../usbscan-ocr" }
usbscan-win = { path = "../usbscan-win" }
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-18",
] }
rodio = { version = "0.20", default-features = false, features = ["mp3"] }
ureq = { version = "2.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"
# Linux 需要显式选择文件对话框后端（Windows / macOS 使用系统原生实现）。
rfd = { version = "0.15", default-features = false, features = [
    "xdg-portal",
    "async-std",
] }
sys-locale = "0.3"

# Windows 使用系统 SChannel；Linux / macOS 使用 rustls（内置根证书），
# 避免 UOS V20/V25 的 libssl1.1 / libssl3 差异。
[target.'cfg(windows)'.dependencies]
native-tls = "0.2"
ureq = { version = "2.12", default-features = false, features = ["native-tls", "json"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

# Windows 专属构建依赖
[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[build-dependencies]
slint-build = "1.18"

[[bin]]
name = "usbscan"
path = "src/main.rs"
